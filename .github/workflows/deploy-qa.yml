name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, test e publicar imagem
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw verify -B

      - name: Preparar JAR para a EC2
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | sort)
          test "${#jars[@]}" -eq 1
          mkdir -p dist
          cp "${jars[0]}" dist/venus-crud.jar

      - name: Guardar JAR do deploy
        uses: actions/upload-artifact@v4
        with:
          name: venus-crud-jar
          path: dist/venus-crud.jar
          if-no-files-found: error
          retention-days: 5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=develop-,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy para a EC2 da Venus-CRUD
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, venus-ec2]
    environment: qa
    env:
      VENUS_CRUD_SERVICE: ${{ vars.VENUS_CRUD_SERVICE || 'auto' }}
      VENUS_CRUD_JAR_PATH: ${{ vars.VENUS_CRUD_JAR_PATH || 'auto' }}
      VENUS_CRUD_HEALTH_URL: ${{ vars.VENUS_CRUD_HEALTH_URL || 'http://127.0.0.1:8080/v3/api-docs' }}
    steps:
      - name: Baixar JAR aprovado pelos testes
        uses: actions/download-artifact@v4
        with:
          name: venus-crud-jar
          path: deploy-artifact

      - name: Atualizar serviço e validar health check
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact="$(find deploy-artifact -maxdepth 2 -type f -name 'venus-crud.jar' -print -quit)"
          test -n "$artifact"
          test -x /usr/local/sbin/venus-crud-deploy
          sudo /usr/local/sbin/venus-crud-deploy "$artifact" "$VENUS_CRUD_SERVICE" "$VENUS_CRUD_JAR_PATH" "$VENUS_CRUD_HEALTH_URL"
