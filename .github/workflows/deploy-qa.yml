name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, test e publicar imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build e testes
        run: ./mvnw verify -B

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=develop-,format=short

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Informar imagem de deploy
        id: image
        run: echo "value=ghcr.io/venus-system/venus-crud:staging" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy da imagem na EC2
    needs: build-and-push
    runs-on: [self-hosted, linux, x64, venus-ec2]
    environment: qa
    permissions:
      contents: read
      packages: read
    env:
      VENUS_CRUD_IMAGE: ${{ needs.build-and-push.outputs.image }}
      VENUS_CRUD_SERVICE: ${{ vars.VENUS_CRUD_SERVICE || 'venus-crud.service' }}
      VENUS_CRUD_LOCAL_IMAGE: ${{ vars.VENUS_CRUD_LOCAL_IMAGE || 'auto' }}
      VENUS_CRUD_HEALTH_URL: ${{ vars.VENUS_CRUD_HEALTH_URL || 'http://127.0.0.1:8080/v3/api-docs' }}
    steps:
      - name: Atualizar container pela imagem do GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | sudo /usr/local/sbin/venus-crud-deploy \
            "$VENUS_CRUD_IMAGE" \
            "$VENUS_CRUD_SERVICE" \
            "$VENUS_CRUD_LOCAL_IMAGE" \
            "$VENUS_CRUD_HEALTH_URL" \
            "$GHCR_USER"
