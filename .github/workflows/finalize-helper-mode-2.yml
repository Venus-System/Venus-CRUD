name: Finalize helper mode 2

on:
  push:
    branches:
      - ci/automatic-deploy-ec2

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Mark helper executable and remove this workflow
        shell: bash
        env:
          TARGET_NAME: matheus-orestes
          TARGET_EMAIL: 100971661+matheus-orestes@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$TARGET_NAME"
          git config user.email "$TARGET_EMAIL"
          chmod +x deploy/venus-crud-deploy.sh
          git add --chmod=+x deploy/venus-crud-deploy.sh
          git rm -f .github/workflows/finalize-helper-mode-2.yml
          git diff --cached --summary
          GIT_AUTHOR_NAME="$TARGET_NAME" \
          GIT_AUTHOR_EMAIL="$TARGET_EMAIL" \
          GIT_COMMITTER_NAME="$TARGET_NAME" \
          GIT_COMMITTER_EMAIL="$TARGET_EMAIL" \
          git commit -m "fix: preservar modo executável do helper"
          git push origin "HEAD:$GITHUB_REF_NAME"
